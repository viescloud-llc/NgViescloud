<ul class="margin-center">

  <li class="filter-row">
    <app-mat-form-field-input
      [value]="searchTerm()"
      (valueChange)="onSearchTerm($event)"
      [inputMap]="inputField('order-search')
                    .set(inputKeys.label, 'Search orders')
                    .set(inputKeys.placeholder, 'Order number, company, notes…')
                    .set(inputKeys.showClearIcon, true)
                    .set(inputKeys.styleWidth, '100%')"
    ></app-mat-form-field-input>

    <app-mat-form-field-input-option
      [value]="statusFilter()"
      (valueChange)="onStatus($event)"
      [options]="statusOptions"
      [noneLabel]="''"
      [inputMap]="inputField('order-status-filter')
                    .set(inputKeys.label, 'Status')
                    .set(inputKeys.styleWidth, '220px')"
    ></app-mat-form-field-input-option>

    <label class="date-field">From <input type="date" [value]="from()" (change)="onFrom($any($event.target).value)" /></label>
    <label class="date-field">To <input type="date" [value]="to()" (change)="onTo($any($event.target).value)" /></label>
    @if (customerId()) {
      <span class="chip">Customer filter <button matButton (click)="clearCustomer()" type="button">clear</button></span>
    }
  </li>

  <li>
    <app-mat-table
      [matRows]="orders()"
      [blankObject]="blankOrder"
      (onEditRow)="selectOrder($event)"
    ></app-mat-table>
    <app-server-pager [page]="page()" [size]="size()" [total]="result().totalElements" [loading]="loading()"
                      (pageChange)="onPage($event)" (sizeChange)="onSize($event)"></app-server-pager>
  </li>
  <li class="flex-row-container-auto">
    @if (canCreate()) { <button matButton="filled" (click)="newOrder()" type="button">New order (phone / counter)</button> }
  </li>
</ul>
