<ul class="margin-center">

  <li class="filter-row">
    <app-mat-form-field-input
      [value]="searchTerm()"
      (valueChange)="onSearchTerm($event)"
      [inputMap]="inputField('return-search')
                    .set(inputKeys.label, 'Search returns')
                    .set(inputKeys.placeholder, 'Return number, order number, reason…')
                    .set(inputKeys.showClearIcon, true)
                    .set(inputKeys.styleWidth, '100%')"
    ></app-mat-form-field-input>

    <app-mat-form-field-input-option
      [value]="statusFilter()"
      (valueChange)="onStatus($event)"
      [options]="statusOptions"
      [noneLabel]="''"
      [inputMap]="inputField('return-status-filter')
                    .set(inputKeys.label, 'Status')
                    .set(inputKeys.styleWidth, '240px')"
    ></app-mat-form-field-input-option>
  </li>

  <li>
    <app-mat-table
      [matRows]="returns()"
      [blankObject]="blankReturn"
      (onEditRow)="selectReturn($event)"
    ></app-mat-table>
    <app-server-pager [page]="page()" [size]="size()" [total]="result().totalElements" [loading]="loading()"
                      (pageChange)="onPage($event)" (sizeChange)="onSize($event)"></app-server-pager>
  </li>
  <br>
  <li class="flex-row-container-auto">
    <button matButton="filled" (click)="addReturn()">Create return</button>
  </li>
</ul>
