<ul class="margin-center">

  <li class="filter-row">
    <app-mat-form-field-input
      [value]="searchTerm()"
      (valueChange)="searchTerm.set($event)"
      [inputMap]="inputField('discount-search')
                    .set(inputKeys.label, 'Search discounts')
                    .set(inputKeys.placeholder, 'By code or description…')
                    .set(inputKeys.showClearIcon, true)
                    .set(inputKeys.styleWidth, '100%')"
    ></app-mat-form-field-input>
  </li>

  <li>
    <app-mat-table
      [matRows]="filteredDiscounts()"
      [blankObject]="blankDiscount"
      (onEditRow)="selectDiscount($event)"
    ></app-mat-table>
  </li>
  <br>
  <li class="flex-row-container-auto">
    <button matButton="filled" (click)="addDiscount()">Add discount</button>
  </li>

  <li>
    <app-csv-import-export fileName="discounts.csv" title="Discounts CSV" [canImport]="canUpdate()"
      hint="Upsert by code. Dates as 2026-01-31 or 2026-01-31T23:59:00; tags/categories by name separated with |. Attribute-definition matches and usage counters are not covered."
      columns="code, description, discountType, discountValue, minimumOrderAmount, maximumDiscountAmount, validFrom, validTo, maxUses, active, tags, categories"
      [exportFn]="exportDiscounts" [importFn]="importDiscounts" (applied)="refresh()"></app-csv-import-export>
  </li>
</ul>
