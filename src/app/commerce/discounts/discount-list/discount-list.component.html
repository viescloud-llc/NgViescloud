<ul class="margin-center">

  <li class="filter-row">
    <app-mat-form-field-input
      [value]="searchTerm()"
      (valueChange)="searchTerm.set($event)"
      [inputMap]="inputField('discount-search')
                    .set(inputKeys.label, 'Search discounts')
                    .set(inputKeys.placeholder, 'By code or description…')
                    .set(inputKeys.showClearIcon, true)
                    .set(inputKeys.styleWidth, '100%')"
    ></app-mat-form-field-input>
  </li>

  <li>
    <app-mat-table
      [matRows]="filteredDiscounts()"
      [blankObject]="blankDiscount"
      (onEditRow)="selectDiscount($event)"
    ></app-mat-table>
  </li>
  <br>
  <li class="flex-row-container-auto">
    <button matButton="filled" (click)="addDiscount()">Add discount</button>
  </li>
</ul>
