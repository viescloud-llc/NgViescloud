<app-mat-form-field-input-list-option [value]="pinnedProducts()" (valueChange)="onProducts($event)" [options]="productOptions()" [inputMap]="pick('sel-products', 'Pinned products (shown first, in this order)')"></app-mat-form-field-input-list-option>
<app-mat-form-field-input-list-option [value]="selectedCategories()" (valueChange)="onCategories($event)" [options]="categoryOptions()" [inputMap]="pick('sel-categories', 'Categories (incl. sub-categories)')"></app-mat-form-field-input-list-option>
<app-mat-form-field-input-list-option [value]="selectedTags()" (valueChange)="onTags($event)" [options]="tagOptions()" [inputMap]="pick('sel-tags', 'Tags')"></app-mat-form-field-input-list-option>
<app-mat-form-field-input-list-option [value]="selectedDefs()" (valueChange)="onDefs($event)" [options]="defOptions()" [inputMap]="pick('sel-defs', 'Attribute definitions')"></app-mat-form-field-input-list-option>
<div class="row">
  <app-mat-form-field-input-option [value]="value().match" (valueChange)="onMatch($event)" [options]="matchOptions" [noneLabel]="''" [inputMap]="inputField('sel-match').set(inputKeys.label, 'Combine criteria').set(inputKeys.styleWidth, '180px').set(inputKeys.disable, disabled())"></app-mat-form-field-input-option>
  <app-mat-form-field-input-option [value]="value().sort" (valueChange)="onSort($event)" [options]="sortOptions" [noneLabel]="''" [inputMap]="inputField('sel-sort').set(inputKeys.label, 'Sort').set(inputKeys.styleWidth, '220px').set(inputKeys.disable, disabled())"></app-mat-form-field-input-option>
  <app-mat-form-field-input [value]="value().limit" (valueChange)="onLimit($event)" [blankObject]="0" [inputMap]="inputField('sel-limit').set(inputKeys.label, 'Max products').set(inputKeys.styleWidth, '130px').set(inputKeys.disable, disabled())"></app-mat-form-field-input>
  <button matButton (click)="previewMatches()" type="button">Preview matches</button>
</div>
@if (matches(); as m) {
  <div class="preview">{{ m.length }} product(s): @for (p of m; track p.id; let last = $last) {{{ p.name }}{{ last ? '' : ', ' }}}@if (m.length === 0) { — nothing matches yet }</div>
}
