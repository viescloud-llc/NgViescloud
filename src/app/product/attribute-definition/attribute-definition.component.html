<ul class="margin-center" appMatFormFieldGroup (onAllInputCheck)="validForm.set($event)">
  <li>
    <app-mat-form-field-input-dynamic
    [(value)]="value"
    [blankObject]="blankValue"
    [inputMap]="inputField('1').set(inputKeys.indent, false).set(inputKeys.styleWidth, '100%')"
    ></app-mat-form-field-input-dynamic>
  </li>
  <li>
    <app-attribute-option-list
    [showTable]="false"    
    ></app-attribute-option-list>
  </li>
  <li>
    <app-mat-form-field-input
    [value]="''"
    [options]="['one', 'two', 'three', 'four', 'five']"
    [inputMap]="inputField('2').set(inputKeys.styleWidth, '100%')
                               .set(inputKeys.label, 'test option')
                               .set(inputKeys.optionsAutoActiveFirst, true)
                               .set(inputKeys.optionsrequireSelection, true)"
    ></app-mat-form-field-input>
  </li>
  <li class="flex-row-container-auto">
    <button matButton="filled" (click)="save()" [disabled]="_value.isValueNotChange() || !validForm()">Save</button>
    <button matButton="filled" class="warn" (click)="revert()" [disabled]="!_value.isValueChange()">Revert</button>
    <button matButton="filled" class="warn" (click)="remove()" [disabled]="_value.isValueNotChange() || !validForm()">Delete</button>
  </li>
</ul>
