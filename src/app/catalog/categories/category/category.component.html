<ul class="margin-center" appMatFormFieldGroup [formSummitButton]="viesSaveBtn" (onAllInputCheck)="validForm.set($event)">

  <!-- Main form: name, description (auto-rendered from decorators on Category).
       Same spread-on-emit workaround as elsewhere. -->
  <li>
    <app-mat-form-field-input-dynamic
      [value]="value()"
      (valueChange)="onMainFormChange($event)"
      [blankObject]="blankValue"
      [inputMap]="inputField('cat')
                    .set(inputKeys.indent, false)
                    .set(inputKeys.styleWidth, '100%')"
    ></app-mat-form-field-input-dynamic>
  </li>

  <!-- Parent picker as a searchable autocomplete. Value is a Category object so
       the lib's displayFn falls through to the options lookup and shows the
       parent's name in the input rather than its UUID. Excludes self and
       descendants passively (via `parentOptions`), so the admin can't create a
       cycle from the picker. `optionsrequireSelection` prevents partial text
       from persisting as an unresolved parent. NOT using `manuallyEmitValue` —
       clicking an option must commit immediately (with it, the input showed the
       pick but the model kept the old parent until Enter); onParentChange
       ignores the partial-text emissions that come with keystrokes. -->
  <li class="option-add-row">
    <app-mat-form-field-input
      [value]="selectedParent()"
      (valueChange)="onParentChange($event)"
      [options]="parentOptions()"
      [inputMap]="inputField('parent-search')
                    .set(inputKeys.label, 'Parent Category')
                    .set(inputKeys.placeholder, 'Search existing categories… ( leave blank for root )')
                    .set(inputKeys.optionsAutoActiveFirst, true)
                    .set(inputKeys.optionsrequireSelection, true)
                    .set(inputKeys.showClearIcon, true)
                    .set(inputKeys.styleWidth, '100%')"
    ></app-mat-form-field-input>

    <button matButton="filled" (click)="openCreateParentDialog()" type="button">
      Quick-add parent
    </button>
  </li>

  <!-- M2M: which AttributeDefinitions apply to products in this category. -->
  <li>
    <app-mat-form-field-input-list-option
      [value]="value()?.attributeDefinitions || []"
      (valueChange)="onAttributeDefinitionsChange($event)"
      [options]="attributeDefinitionOptions()"
      [inputMap]="inputField('attrs')
                    .set(inputKeys.label, 'Attribute Definitions')
                    .set(inputKeys.styleWidth, '100%')
                    .set(inputKeys.showSizeInput, false)
                    .set(inputKeys.showSearchOption, true)
                    .set(inputKeys.uniqueValue, true)"
    ></app-mat-form-field-input-list-option>
  </li>

  <!-- Child-count hint. -->
  @if (childCount() > 0) {
    <li class="schema-hint">
      <strong>This category has {{ childCount() }} direct child{{ childCount() === 1 ? '' : 'ren' }}.</strong>
      Deleting it leaves them orphaned (their <code>parentCategoryId</code> will
      point at a missing row). They'll surface under "Orphaned" in the category
      list view for re-parenting.
    </li>
  }

  <li class="flex-row-container-auto">
    <button #viesSaveBtn matButton="filled" (click)="save()" [disabled]="_value.isValueNotChange() || !validForm()">Save</button>
    <button matButton="filled" class="warn" (click)="revert()" [disabled]="!_value.isValueChange()">Revert</button>
    <button matButton="filled" class="warn" (click)="remove()" [disabled]="!id()">Delete</button>
  </li>
</ul>
