<ul class="margin-center">
  <li>
    <app-mat-table
      [matRows]="attributeOptionList()"
      [blankObject]="blankAttributeOption"
      (onEditRow)="selectAttributeOption($event)"
    ></app-mat-table>
  </li>
  <br>
  <li class="flex-row-container-auto">
    <button matButton="filled" (click)="addAttributeOption()">Add attribute option</button>
  </li>
</ul>
