<ul class="margin-center">

  <li>
    <p class="tab-hint">
      Append-only audit log. To correct a mistake, add a compensating
      <strong>adjustment</strong> from the Stock page — history is never edited.
    </p>
  </li>

  <li class="filter-row">
    <app-mat-form-field-input
      [value]="searchTerm()"
      (valueChange)="onSearchTerm($event)"
      [inputMap]="inputField('movement-search')
                    .set(inputKeys.label, 'Search movements')
                    .set(inputKeys.placeholder, 'Reason, reference or SKU…')
                    .set(inputKeys.showClearIcon, true)
                    .set(inputKeys.styleWidth, '100%')"
    ></app-mat-form-field-input>

    <app-mat-form-field-input-option
      [value]="typeFilter()"
      (valueChange)="onType($event)"
      [options]="typeOptions"
      [noneLabel]="''"
      [inputMap]="inputField('movement-type-filter')
                    .set(inputKeys.label, 'Type')
                    .set(inputKeys.styleWidth, '200px')"
    ></app-mat-form-field-input-option>

    <app-mat-form-field-input-option
      [value]="warehouseFilter()"
      (valueChange)="onWarehouse($event)"
      [options]="warehouseOptions()"
      [noneLabel]="''"
      [inputMap]="inputField('movement-warehouse-filter')
                    .set(inputKeys.label, 'Warehouse')
                    .set(inputKeys.styleWidth, '200px')"
    ></app-mat-form-field-input-option>

    <label class="date-field">From <input type="date" [value]="from()" (change)="onFrom($any($event.target).value)" /></label>
    <label class="date-field">To <input type="date" [value]="to()" (change)="onTo($any($event.target).value)" /></label>
  </li>

  <li>
    <app-mat-table
      [matRows]="movements()"
      [blankObject]="blankMovement"
    ></app-mat-table>
    <app-server-pager [page]="page()" [size]="size()" [total]="result().totalElements" [loading]="loading()"
                      (pageChange)="onPage($event)" (sizeChange)="onSize($event)"></app-server-pager>
  </li>
</ul>
