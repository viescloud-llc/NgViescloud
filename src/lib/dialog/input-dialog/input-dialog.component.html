<h1 mat-dialog-title>{{data.title}}</h1>
<div mat-dialog-content>
  @if (!data.multipleLine) {
    <app-mat-form-field-input
      [value]="input" (valueChange)="input = $event.toString()"
      [inputMap]="inputField('1').set(inputKeys.styleWidth, '100%')
                                 .set(inputKeys.autoResize, true)
                                 .set(inputKeys.label, label)
                                 .set(inputKeys.placeholder, data.placeholder ?? '')"
    ></app-mat-form-field-input>
  }
  @if (data.multipleLine) {
    <app-mat-form-field-input-text-area
      [value]="input" (valueChange)="input = $event.toString()"
      [inputMap]="inputField('2').set(inputKeys.styleWidth, '100%')
                                 .set(inputKeys.autoResize, true)
                                 .set(inputKeys.label, label)
                                 .set(inputKeys.cols, 50)
                                 .set(inputKeys.rows, 10)
                                 .set(inputKeys.placeholder, data.placeholder ?? '')"
    ></app-mat-form-field-input-text-area>
  }
</div>
<div mat-dialog-actions>
  <button matButton="filled" [mat-dialog-close]="input" cdkFocusInitial>{{yes}}</button>
  @if (no) {
    <button matButton="filled" class="warn" mat-dialog-close>{{no}}</button>
  }
</div>
