@if (!openIdLogin()) {
  <ul class="margin-center-li-center" appMatFormFieldGroup (onAllInputCheck)="validForm.set($event)" [formSummitButton]="loginButton">
    <li>
      <app-mat-form-field-input
        [(value)]="username"
        [inputMap]="inputField('1').set(inputKeys.label, 'Username or email')
                                   .set(inputKeys.required, true)
                                   .set(inputKeys.styleWidth, '50%')"  
      ></app-mat-form-field-input>
    </li>
    <li>
      <app-mat-form-field-input
        [(value)]="password"
        [inputMap]="inputField('2').set(inputKeys.label, 'Password')
                                   .set(inputKeys.required, true)
                                   .set(inputKeys.showVisibleSwitch, true)
                                   .set(inputKeys.styleWidth, '50%')"  
      ></app-mat-form-field-input>
    </li>
    <li>
      <button #loginButton [style.width]="'50%'" matButton="filled" (click)="login()" [disabled]="!validForm()">Login</button>
    </li>
    @for (provider of ensibleOpenIDProviders; track provider) {
      <li>
        <br>
          <button [style.width]="'50%'" matButton="filled" (click)="loginWithProvider(provider)" >Login with {{provider.name}}</button>
        </li>
      }
    </ul>
  }


  @if (openIdLogin()) {
    <ul class="margin-center">
      <li>
        <h1>{{loading}}</h1>
      </li>
    </ul>
  }
