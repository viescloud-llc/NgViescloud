<ul class="margin-center" >
  <li>
    <h1 class="text-center">User Setting</h1>
  </li>

  <ng-container appMatFormFieldGroup (onAllInputCheck)="validForm = $event" (onFormSummit)="changePassword()">
    <li><h4>Change Password</h4></li>
    <li>
      <app-mat-form-field-input
        [(value)]="currentPassword"
        [blankObject]="''"
        [inputMap]="inputField('1').set(inputKeys.label, 'Current password')
                                   .set(inputKeys.showVisibleSwitch, true)
                                   .set(inputKeys.styleWidth, '100%')
                                   .set(inputKeys.required, true)"
      ></app-mat-form-field-input>
    </li>
    <li>
      <app-mat-form-field-input
        [(value)]="newPassword"
        [blankObject]="''"
        [inputMap]="inputField('2').set(inputKeys.label, 'New password')
                                   .set(inputKeys.showVisibleSwitch, true)
                                   .set(inputKeys.styleWidth, '100%')
                                   .set(inputKeys.required, true)"
      ></app-mat-form-field-input>
    </li>
    <li>
      <app-mat-form-field-input
        [(value)]="reNewPassword"
        [blankObject]="''"
        [inputMap]="inputField('3').set(inputKeys.label, 'Confirm new password')
                                   .set(inputKeys.showVisibleSwitch, true)
                                   .set(inputKeys.styleWidth, '100%')
                                   .set(inputKeys.required, true)"
      ></app-mat-form-field-input>
    </li>
    @if (error) {
      <li>
        <span style="color: red;">{{error}}</span>
      </li>
    }
    <li class="flex-row-container-auto">
      <button matButton="filled" [disabled]="!isValidForm()" (click)="changePassword()">Change Password</button>
    </li>
  </ng-container>

  <ng-container appMatFormFieldGroup (onAllInputCheck)="validForm2 = $event" (onFormSummit)="changeAlias()">
    <hr>
      <li><h4>Change Alias</h4></li>
      <li>
        <app-mat-form-field-input
          [(value)]="alias"
          [blankObject]="''"
          [inputMap]="inputField('4').set(inputKeys.label, 'Alias')
                                     .set(inputKeys.required, true)
                                     .set(inputKeys.styleWidth, '100%')
                                     .set(inputKeys.disable, false)"
        ></app-mat-form-field-input>
      </li>
      <li class="flex-row-container-auto">
        <button matButton="filled" [disabled]="!validForm2 || alias === aliasCopy" (click)="changeAlias()">Change Alias</button>
      </li>
    </ng-container>
  </ul>
