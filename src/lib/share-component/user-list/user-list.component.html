@if (!selectedUser) {
  <ul class="margin-center">
    <li>
      <app-mat-table
        [matRows]="users()"
        [blankObject]="blankUser"
        [showMatTooltip]="true"
        [showPagination]="true"
        [showFilter]="true"
        (onEditRow)="selectUser($event)"
      ></app-mat-table>
    </li>
    <li>
      <br>
      <button [style.width]="'100%'" matButton="filled" (click)="addUser()">Add user</button>
    </li>
  </ul>
}

@if (selectedUser) {
  <ul class="margin-center" appMatFormFieldGroup (onAllInputCheck)="validForm = $event">
    <li class="flex-row-container">
      <button matButton="filled" (click)="selectedUser = undefined">Back</button>
      <button matButton="filled" (click)="addUserGroup()">Add user group</button>
      <button matButton (click)="showEffectivePermissions()" type="button">Effective permissions…</button>
    </li>
    <hr>
    <li>
      <app-mat-form-field-input-list-option
        label="User Groups"
        [(value)]="selectedUser.userGroups"
        [options]="userGroupsOptions()"
        [inputMap]="inputField('1').set(inputKeys.label, 'User Groups')
                                    .set(inputKeys.styleWidth, '100%')
                                    .set(inputKeys.showSizeInput, false)
                                    .set(inputKeys.minSize, 1)
                                    .set(inputKeys.uniqueValue, true)
                                    .set(inputKeys.required, true)"
      ></app-mat-form-field-input-list-option>
      <br>
    </li>
    <li>
      <!-- Directly-assigned roles (exception grants). Group roles are inherited
           automatically — see "Effective permissions" for the union. -->
      <app-mat-form-field-input-list-option
        label="Roles"
        [(value)]="selectedUser.roles"
        [options]="roleOptions()"
        [inputMap]="inputField('roles').set(inputKeys.label, 'Roles (directly assigned)')
                                        .set(inputKeys.styleWidth, '100%')
                                        .set(inputKeys.showSizeInput, false)
                                        .set(inputKeys.showSearchOption, true)
                                        .set(inputKeys.expanded, true)
                                        .set(inputKeys.uniqueValue, true)"
      ></app-mat-form-field-input-list-option>
      <p class="hint">Roles from the user's groups are inherited automatically; the effective set is the union.</p>
    </li>
    <li>
      <app-mat-form-field-input-dynamic
        [(value)]="selectedUser"
        [blankObject]="blankUser"
        [inputMap]="inputField('2').set(inputKeys.styleWidth, '100%')
                                    .set(inputKeys.indent, false)"
      ></app-mat-form-field-input-dynamic>
    </li>
    <li>
      <app-mat-form-field-input
        [(value)]="selectedUser.password"
        [inputMap]="inputField('3').set(inputKeys.label, 'Password' + (!selectedUser.id ? '' : ' \(Leave blank if you don\'t want to change password\)'))
                                    .set(inputKeys.required, !selectedUser.id)
                                    .set(inputKeys.showVisibleSwitch, true)
                                    .set(inputKeys.styleWidth, '100%')"
      ></app-mat-form-field-input>
    </li>
    <li class="flex-row-container-auto">
      <button matButton="filled" (click)="save()" [disabled]="!isValueChange() || !validForm">Save</button>
      <button matButton="filled" class="warn" (click)="revert()" [disabled]="!isValueChange() || !validForm">revert</button>
    </li>
  </ul>
}
