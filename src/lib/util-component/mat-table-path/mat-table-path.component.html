@if (!unixStyleBack) {
  <button mat-icon-button [matTooltip]="'go back'" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>
}

<app-mat-form-field-input
  [(value)]="currentPath"
  (onValueChange)="checkValidPath()"
  [inputMap]="inputMap.clone()
                      .set(inputKeys.label, 'Current Path')
                      .set(inputKeys.styleWidth, '100%')
                      .set(inputKeys.focusOutAutoFillFn, formatDash)
                      .set(inputKeys.readonly, readonlyPathInput)
                      .set(inputKeys.readonlyOnFocusHintLeft, 'Path is readonly')"
></app-mat-form-field-input>
<br>
  <app-mat-table
    [matRows]="customRows"
    [blankObject]="blankRow"
    [showMultipleRowSelection]="showMultipleRowSelection"
    (onEditRow)="selectedRow($event)"
    (onMiddleClickRow)="middleClickItem($event)"
    (onMultipleRowSelected)="onMultipleRowSelectedEmit($event)"
  ></app-mat-table>
