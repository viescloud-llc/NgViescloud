<mat-expansion-panel [ngStyle]="{width: getInputValue(inputKeys.styleWidth)}" appMatFormFieldGroup (onAllInputCheck)="validForm = $event">
  <mat-expansion-panel-header>
    <mat-panel-title>
      color picker for {{getInputValue(inputKeys.label)}}
    </mat-panel-title>
    <mat-panel-description>
      <span [ngStyle]="getNgStyle()">{{value.name}}</span>
    </mat-panel-description>
  </mat-expansion-panel-header>
  <ul>
    <li>
      <app-mat-form-field-input-option
        [(value)]="value"
        (onValueChange)="emitValue()"
        [options]="sampleOptions"
        [noneLabel]="'None'"
        [inputMap]="inputMap.clone().set(inputKeys.styleWidth, '100%')"
      ></app-mat-form-field-input-option>
    </li>
    @if (value.name === 'Custom') {
      <li>
        <app-mat-form-field-input
          [(value)]="value.r"
          [inputMap]="inputMap.clone()
                              .set(inputKeys.label, 'R')
                              .set(inputKeys.defaultType, 'number')
                              .set(inputKeys.max, 255)
                              .set(inputKeys.min, 0)
                              .set(inputKeys.showClearIcon, false)
                              .set(inputKeys.showMinMaxHint, true)
                              .set(inputKeys.placeholder, 'e.g 255')
                              .set(inputKeys.styleWidth, 'fit-content')
                              .set(inputKeys.required, true)"
        ></app-mat-form-field-input>
        <app-mat-form-field-input
          [(value)]="value.g"
          [inputMap]="inputMap.clone()
                              .set(inputKeys.label, 'G')
                              .set(inputKeys.defaultType, 'number')
                              .set(inputKeys.max, 255)
                              .set(inputKeys.min, 0)
                              .set(inputKeys.showClearIcon, false)
                              .set(inputKeys.showMinMaxHint, true)
                              .set(inputKeys.placeholder, 'e.g 255')
                              .set(inputKeys.styleWidth, 'fit-content')
                              .set(inputKeys.required, true)"
        ></app-mat-form-field-input>
        <app-mat-form-field-input
          [(value)]="value.b"
          [inputMap]="inputMap.clone()
                              .set(inputKeys.label, 'B')
                              .set(inputKeys.defaultType, 'number')
                              .set(inputKeys.max, 255)
                              .set(inputKeys.min, 0)
                              .set(inputKeys.showClearIcon, false)
                              .set(inputKeys.showMinMaxHint, true)
                              .set(inputKeys.placeholder, 'e.g 255')
                              .set(inputKeys.styleWidth, 'fit-content')
                              .set(inputKeys.required, true)"
        ></app-mat-form-field-input>
      </li>
    }
  </ul>
</mat-expansion-panel>
