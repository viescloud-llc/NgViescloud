<mat-form-field [appearance]="getAppearance()" [color]="getInputValue(inputKeys.matColor)"  [style.width.ch]="getSize(value ? value.toString() : '')" [style.width]="getInputValue(inputKeys.styleWidth)">
  <mat-label>{{getInputValue(inputKeys.label)}}</mat-label>
  <mat-select
    [(ngModel)]="value"
    (ngModelChange)="emitValue()"
    [disabled]="getInputValue(inputKeys.disable) || getInputValue(inputKeys.readonly)"
    [required]="getInputValue(inputKeys.required)"
    (opened)="emitOpened()"
    (closed)="emitClosed()"
    (selectionChange)="emitSelectionChange($event)">
    @if (noneLabel) {
      <mat-option [value]="noneLabelValue">{{noneLabel}}</mat-option>
    }
    @for (option of options; track option) {
      <mat-option [value]="option.value" [disabled]="option.disable">{{option.valueLabel}}</mat-option>
    }
    @if (getInputValue(inputKeys.customOptionLabel)) {
      <mat-option [value]="getInputValue(inputKeys.customOptionLabel)" (click)="onCustomOptionSelected.emit()"><p [style.color]="getInputValue(inputKeys.customOptionLabelColor)">{{getInputValue(inputKeys.customOptionLabel)}}</p></mat-option>
    }
  </mat-select>
  <mat-error>{{getInputValue(inputKeys.label)}} can't be empty</mat-error>
</mat-form-field>
